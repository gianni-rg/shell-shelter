name: CI and Packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_cli_artifact:
        description: "Publish the Windows CLI artifact"
        required: false
        default: true
        type: boolean
      pack_nuget:
        description: "Pack and upload the ShellShelter.Core NuGet package"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ShellShelter.sln

      - name: Build
        run: dotnet build ShellShelter.sln -c Release --no-restore

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >-
          dotnet test tests/ShellShelter.Tests/ShellShelter.Tests.csproj
          -c Release
          --no-build
          --verbosity minimal
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults/${{ matrix.os }}

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: >-
          dotnet test tests/ShellShelter.Tests/ShellShelter.Tests.csproj
          -c Release
          --no-build
          --verbosity minimal
          --logger trx
          --results-directory TestResults/${{ matrix.os }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ShellShelter.sln

      - name: Check formatting
        run: dotnet format ShellShelter.sln --verify-no-changes --verbosity minimal

  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      informational_version: ${{ steps.gitversion.outputs.informationalVersion }}
      is_release_tag: ${{ steps.version.outputs.is_release_tag }}
      is_stable_release: ${{ steps.version.outputs.is_stable_release }}
      should_package: ${{ steps.version.outputs.should_package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.4.2
        with:
          versionSpec: 6.x

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.4.2

      - name: Set packaging flags
        id: version
        shell: bash
        run: |
          set -euo pipefail

          is_release_tag=false
          is_stable_release=false
          should_package=false

          if [[ '${{ github.ref_type }}' == 'tag' && '${{ github.ref_name }}' =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            is_release_tag=true
          fi

          if [[ '${{ github.ref_type }}' == 'tag' && '${{ github.ref_name }}' =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_stable_release=true
          fi

          if [[ "${is_release_tag}" == "true" || '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            should_package=true
          fi
          echo "is_release_tag=${is_release_tag}" >> "$GITHUB_OUTPUT"
          echo "is_stable_release=${is_stable_release}" >> "$GITHUB_OUTPUT"
          echo "should_package=${should_package}" >> "$GITHUB_OUTPUT"
          echo "Resolved semantic version: ${{ steps.gitversion.outputs.fullSemVer }}"

  package-cli:
    name: Package CLI
    runs-on: ubuntu-latest
    needs: [validate, resolve-version]
    if: ${{ needs.resolve-version.outputs.should_package == 'true' && (github.event_name == 'push' || inputs.publish_cli_artifact == true) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ShellShelter.sln

      - name: Publish CLI
        run: >-
          dotnet publish src/ShellShelter.Cli/ShellShelter.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Version=${{ needs.resolve-version.outputs.version }}
          -p:InformationalVersion=${{ needs.resolve-version.outputs.informational_version }}
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/cli

      - name: Verify CLI output
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/cli/shellshelter.exe

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cli-package
          cp artifacts/cli/shellshelter.exe artifacts/cli-package/
          cd artifacts/cli-package
          zip -q "shellshelter-${{ needs.resolve-version.outputs.version }}-win-x64.zip" shellshelter.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: shellshelter-cli-${{ needs.resolve-version.outputs.version }}
          path: artifacts/cli-package/shellshelter-${{ needs.resolve-version.outputs.version }}-win-x64.zip

  pack-core:
    name: Pack Core NuGet
    runs-on: ubuntu-latest
    needs: [validate, resolve-version]
    if: ${{ needs.resolve-version.outputs.should_package == 'true' && (github.event_name == 'push' || inputs.pack_nuget == true) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ShellShelter.sln

      - name: Build ShellShelter.Core
        run: >-
          dotnet build src/ShellShelter.Core/ShellShelter.Core.csproj
          -c Release
          --no-restore
          -p:Version=${{ needs.resolve-version.outputs.version }}
          -p:InformationalVersion=${{ needs.resolve-version.outputs.informational_version }}

      - name: Pack ShellShelter.Core
        run: >-
          dotnet pack src/ShellShelter.Core/ShellShelter.Core.csproj
          -c Release
          --no-build
          -o artifacts/nuget
          /p:PackageVersion=${{ needs.resolve-version.outputs.version }}
          /p:InformationalVersion=${{ needs.resolve-version.outputs.informational_version }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v6
        with:
          name: shellshelter-core-${{ needs.resolve-version.outputs.version }}
          path: artifacts/nuget/*.nupkg

  publish-packages:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: [validate, resolve-version, pack-core]
    if: ${{ needs.resolve-version.outputs.is_stable_release == 'true' }}

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: shellshelter-core-${{ needs.resolve-version.outputs.version }}
          path: artifacts/nuget

      - name: Publish package to NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done
